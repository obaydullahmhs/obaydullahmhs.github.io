# your projects
projects:
- name: KubeDB Kafka
  logo: /images/sections/projects/kubedb.png
  role: Software Engineer
  timeline: "2023 - 2026"
  url: "https://kubedb.com/docs/latest/guides/kafka/"
  summary: >-
    Deploying and managing Apache Kafka on Kubernetes. Improved the Kafka CRD and controller, designed new CRDs
    and controllers for Kafka Connect, Schema Registry, and REST Proxy, added custom configuration and TLS/SSL,
    and implemented day-2 operations - scaling, upgrades, and reconfiguration. Also built the Prometheus alerts
    and Grafana dashboards, plus e2e tests and user guides.
  tags: ["kubernetes", "data", "kafka", "go"]

- name: KubeDB GitOps
  logo: /images/sections/projects/kubedb.png
  role: Software Engineer
  url: "https://kubedb.com/"
  summary: >-
    Operating KubeDB databases through Git. Added CRDs mirroring the KubeDB database APIs and a controller that
    syncs GitOps CR changes into KubeDB CRs, so scaling, reconfiguration, and version upgrades all happen through
    ordinary Git workflows with FluxCD or ArgoCD. Documented the workflow for each supported database.
  tags: ["kubernetes", "gitops", "go"]

- name: Voyager Gateway
  logo: /images/sections/projects/voyagermesh.png
  role: Software Engineer
  url: "https://voyagermesh.com/"
  summary: >-
    An extension of the Kubernetes Gateway API for database-specific routing. Introduced custom routes that
    understand database protocols, exposed multiple database nodes through a single route, and made database UIs
    reachable securely over the Gateway API's HTTPRoute - all backed by Envoy.
  tags: ["kubernetes", "data", "gateway-api", "go"]
