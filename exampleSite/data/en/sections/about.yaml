# a summary about you
summary: 'Software Engineer with 3+ years of experience building cloud-native infrastructure in [Go](https://go.dev/). At [AppsCode](https://appscode.com) I worked on the [KubeDB](https://kubedb.com) operator - designing CRDs and Kubernetes controllers that provision and operate [Kafka](https://kafka.apache.org/), RabbitMQ, and other databases, plus GitOps-driven lifecycle management and a database-aware extension of the [Gateway API](https://gateway-api.sigs.k8s.io/). These days I work on a production trading platform, shipping features and containerized services on Kubernetes. Former competitive programmer - ICPC Asia West Continent Finalist.'

